name: Changelog

# PRs: every PR brings a changelog.d/ fragment (or edits CHANGELOG.md, or says "No changelog").
# main: fold the fragments into CHANGELOG.md and commit them away. The bot push uses GITHUB_TOKEN,
# which starts no workflow run, and leaves no fragment behind, so it cannot loop.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
    paths: ["changelog.d/**"]

permissions:
  contents: read

jobs:
  fragment:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Validate fragments
        run: python3 scripts/changelog_assemble.py --check
      - name: Require a fragment
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$PR_BODY" in *"No changelog"*) echo "PR body says No changelog"; exit 0;; esac
          git diff --name-only --merge-base "$BASE_SHA" "$HEAD_SHA" | grep -E '^(changelog\.d/|CHANGELOG\.md$)' \
            || { echo "::error::Add changelog.d/<topic>.md (see changelog.d/README.md) or write 'No changelog' in the PR body"; exit 1; }

  assemble:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: changelog-assemble
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main  # the tip, not the event sha: an earlier assemble commit may already be there
      - name: Assemble
        run: python3 scripts/changelog_assemble.py
      - name: Commit
        run: |
          git add -A changelog.d CHANGELOG.md
          git diff --cached --quiet && { echo "nothing to assemble"; exit 0; }
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -m "chore: assemble changelog"
          git push origin HEAD:main
