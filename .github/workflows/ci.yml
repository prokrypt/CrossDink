name: CI (build)

on:
  push:
    # Combine branches build so their firmware can be downloaded from the run.
    branches: [main, "test/combined-dink-*"]
  pull_request:

# A newer commit supersedes older PR validation; keep main pushes independent.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  clang-format:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install clang-format-21
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get update
          sudo apt-get install -y clang-format-21

      - name: Run clang-format
        run: |
          PATH="/usr/lib/llvm-21/bin:$PATH" ./bin/clang-format-fix
          git diff --exit-code || (echo "Please run 'bin/clang-format-fix' to fix formatting issues" && exit 1)

  cppcheck:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # The platformio.ini default_envs. A bare `pio check` walks them one after
        # another (~15 min); one job each runs them in parallel.
        environment: [sticky, x4-pro, x4-classic]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Restore PlatformIO packages
        id: pio-cache
        uses: actions/cache/restore@v4
        with:
          # Do not cache PlatformIO's Python virtual environment. It is tied to
          # the runner's Python and can become invalid when restored elsewhere.
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          # Same key as the build job, so cppcheck and build share one ~1 GB
          # entry per env. restore-keys lets a platformio.ini edit start from
          # the previous packages instead of a cold download.
          key: ${{ runner.os }}-platformio-py3.14-core6.1.19-${{ matrix.environment }}-${{ hashFiles('platformio.ini', 'platformio.local.example.ini') }}
          restore-keys: ${{ runner.os }}-platformio-py3.14-core6.1.19-${{ matrix.environment }}-

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Install cppcheck runtime dependency
        # Platform 55.03.39 ships tool-cppcheck 2.20.1, linked against libpcre.so.3,
        # which ubuntu-latest does not install; without it the check exits 127.
        run: sudo apt-get update -q && sudo apt-get install -y -q libpcre3

      - name: Run cppcheck
        run: pio check -e ${{ matrix.environment }} --fail-on-defect low --fail-on-defect medium --fail-on-defect high

      # Only main writes caches: a PR can read main's, but its own are visible to
      # that PR alone and would just push main's out of the 10 GB limit.
      - name: Save PlatformIO packages
        if: github.ref == 'refs/heads/main' && steps.pio-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ steps.pio-cache.outputs.cache-primary-key }}

  build:
    # Firmware artifacts are validated on pull requests; release builds stay
    # in the dedicated release workflow. Pushes build too, only to save the
    # caches: PR runs can restore caches from the base branch, not from other PRs,
    # and never save their own (see "Save PlatformIO packages" in cppcheck).
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # x4-pro-debug compiles the debug-only code (PSRAM log, Goodies, knobs,
        # debug web routes) that the release envs leave out.
        environment: [sticky, x4-pro, x4-classic, x4-pro-debug]
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Restore PlatformIO packages
        id: pio-cache
        uses: actions/cache/restore@v4
        with:
          # Do not cache PlatformIO's Python virtual environment. It is tied to
          # the runner's Python and can become invalid when restored elsewhere.
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          # Same key as the cppcheck job, so both share one ~1 GB entry per
          # env. restore-keys lets a platformio.ini edit start from the
          # previous packages instead of a cold download.
          key: ${{ runner.os }}-platformio-py3.14-core6.1.19-${{ matrix.environment }}-${{ hashFiles('platformio.ini', 'platformio.local.example.ini') }}
          restore-keys: ${{ runner.os }}-platformio-py3.14-core6.1.19-${{ matrix.environment }}-

      - name: Install PlatformIO Core
        run: uv pip install --system -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Pin pioarduino core inside the platform penv
        run: |
          set -euo pipefail
          # Envs with custom_sdkconfig (all DualPoint firmware envs) run a
          # nested `pio run` from ~/.platformio/penv, which the platform creates
          # with an open-ended "pioarduino>=6.1.19". That now resolves to 6.2.0,
          # which needs SCons 4.11 while the platform installs SCons 4.8.1; the
          # two reinstall over each other mid-build and the link fails with
          # "No module named 'SCons.Tool.FortranCommon'". Pin the penv core to
          # the outer core's version. The platform leaves a satisfying version
          # alone. See crosspoint-reader/crosspoint-reader#3594 and
          # pioarduino/platform-espressif32#529.
          pio pkg install -e ${{ matrix.environment }}
          uv pip install --python ~/.platformio/penv/bin/python "pioarduino==6.1.19"
          ~/.platformio/penv/bin/pio --version

      - name: Save PlatformIO packages
        if: github.ref == 'refs/heads/main' && steps.pio-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ steps.pio-cache.outputs.cache-primary-key }}

      - name: Install ccache
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ccache
          echo "CCACHE_DIR=$HOME/.cache/ccache" >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ matrix.environment }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-ccache-${{ matrix.environment }}-

      - name: Build ${{ matrix.environment }} firmware
        env:
          # scripts/pio_ccache.py prefixes the SCons compile commands with ccache;
          # IDF_CCACHE_ENABLE covers the ESP-IDF CMake build of custom_sdkconfig envs.
          # Absolute path: the platform's nested framework build runs from another dir.
          XINK_CCACHE: /usr/bin/ccache
          PLATFORMIO_EXTRA_SCRIPTS: pre:${{ github.workspace }}/scripts/pio_ccache.py
          IDF_CCACHE_ENABLE: "1"
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_NOHASHDIR: "1"
          CCACHE_MAXSIZE: 400M
        run: |
          set -euo pipefail
          ccache -z
          pio run -j4 -e ${{ matrix.environment }} | tee pio-${{ matrix.environment }}.log
          ccache -s

      - name: Save ccache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ matrix.environment }}-${{ github.sha }}

      - name: Extract firmware stats
        run: |
          set -euo pipefail
          {
            echo "## ${{ matrix.environment }} firmware build stats"
            grep -E "RAM:\s|Flash:\s" pio-${{ matrix.environment }}.log | while read -r line; do echo "- ${line}"; done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ${{ matrix.environment }} firmware
        if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/test/combined-dink-')
        # Flashable app image for testing PR and combine builds; the release workflows publish
        # the same renamed firmware-<device>.bin.
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.environment }}
          path: .pio/build/${{ matrix.environment }}/firmware-*.bin
          if-no-files-found: error
          retention-days: 14

  unit-tests:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install build tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q cmake ninja-build libexpat1-dev zlib1g-dev

      - name: Configure
        run: cmake -S test -B build/test -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/test

      - name: Run tests
        run: ctest --test-dir build/test --output-on-failure -j

  # This job is used as the PR required actions check, allows for changes to other steps in the future without breaking
  # PR requirements.
  test-status:
    name: Test Status
    needs:
      - build
      - clang-format
      - cppcheck
      - unit-tests
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Fail because needed jobs failed
        # Fail if any job failed or was cancelled (skipped jobs are ok)
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
      - name: Success
        run: exit 0
