<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ title }}</title>
  <link rel="stylesheet" href="/style.css?v={{ v }}" />
{{ head_extra }}
  <style>
{{ styles }}
  </style>
</head>
<body>
  <h1><img class="logo-mark" src="/logo.png?v={{ v }}" alt="" /><span class="wordmark">Cross<span class="crossdink-header">D</span>ink</span></h1>

  <div class="nav-links">
    <a href="/"{{ cls_home }}>Home</a>
    <a href="/files"{{ cls_files }}>File Manager</a>
    <a href="/settings"{{ cls_settings }}>Settings</a>
    <a href="/fonts"{{ cls_fonts }}>Fonts</a>
    <a href="/battery">Battery</a>
    <a href="/logs"{{ cls_logs }}>Logs</a>
  </div>

{{ body }}

  <p class="footer">CrossDink &bull; Open Source</p>

  <div class="modal-overlay" id="confirmModal">
    <div class="modal">
      <button class="modal-close" data-no>&times;</button>
      <h3 id="confirmTitle"></h3>
      <p id="confirmText"></p>
      <button class="btn btn-danger btn-block" id="confirmYes">Delete</button>
      <button class="btn btn-block" data-no>Cancel</button>
    </div>
  </div>
  <script>
    // Styled stand-in for confirm(): true from the Delete button; false from
    // Cancel, the close button, Escape or a click outside the dialog.
    function confirmModal(title, text) {
      const m = document.getElementById('confirmModal');
      document.getElementById('confirmTitle').textContent = title;
      document.getElementById('confirmText').textContent = text;
      m.classList.add('open');
      return new Promise((resolve) => {
        const done = (ok) => {
          m.classList.remove('open');
          document.removeEventListener('keydown', key);
          resolve(ok);
        };
        const key = (e) => e.key === 'Escape' && done(false);
        document.addEventListener('keydown', key);
        m.onclick = (e) => {
          if (e.target.id === 'confirmYes') done(true);
          else if (e.target === m || 'no' in e.target.dataset) done(false);
        };
      });
    }
  </script>

{{ script }}
</body>
</html>
